<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { padding: 10px; margin: 10px; }
        .links { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>TikTok Video Downloader</h1>
    <form id="downloadForm">
        <input type="text" id="video_url" name="video_url" placeholder="Enter TikTok video URL" required>
        <button type="submit">Download</button>
    </form>
    <div class="links" id="links"></div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const videoUrl = document.getElementById('video_url').value;
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ video_url: videoUrl })
            });
            const links = await response.json();
            document.getElementById('links').innerHTML = Object.keys(links).map(text => `<a href="${links[text]}" target="_blank">${text}</a>`).join('<br>');
        });
    </script>
</body>
</html>
